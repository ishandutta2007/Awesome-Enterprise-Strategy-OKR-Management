<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#111827"/></linearGradient><linearGradient id="titleGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="goldGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient><linearGradient id="accentGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".25"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".05"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="0" r="1.5" fill="#334155"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(2deg)}}@keyframes floatRev{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-2deg)}}@keyframes pulseBeam{0%{opacity:.25;stroke-dashoffset:0}50%{opacity:.7;stroke-dashoffset:40}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes metricPulse{0%{transform:scale(1);opacity:.9}50%{transform:scale(1.05);opacity:1}}.floating-node-1,.floating-node-2{animation:floatSlow 6s ease-in-out infinite;transform-origin:center}.floating-node-2{animation:floatRev 7s ease-in-out infinite}.animated-beam{stroke-dasharray:8 6;animation:pulseBeam 4s linear infinite}.pulse-pill{animation:metricPulse 3s ease-in-out infinite;transform-origin:center}.radar-line{transform-origin:1040px 180px;animation:radarSweep 10s linear infinite}.banner-title{font-weight:800;font-size:38px;letter-spacing:-.5px}.badge-text,.banner-sub,.banner-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.banner-sub{font-weight:400;font-size:16px;fill:#94a3b8}.badge-text{font-weight:600;font-size:12px}</style></defs><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><circle cx="150" cy="100" r="140" fill="#3b82f6" filter="url(#glow)" opacity=".12"/><circle cx="1040" cy="180" r="160" fill="#8b5cf6" filter="url(#glow)" opacity=".15"/><circle cx="600" cy="300" r="120" fill="#06b6d4" filter="url(#glow)" opacity=".08"/><g class="floating-node-1" opacity=".65"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 80,180 L 140,110 L 140,250" class="animated-beam"/><circle cx="80" cy="180" r="7" fill="#38bdf8" filter="url(#glow)"/><circle cx="140" cy="110" r="5" fill="#818cf8"/><circle cx="140" cy="250" r="5" fill="#34d399"/></g><g opacity=".55"><circle cx="1040" cy="180" r="120" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="1040" cy="180" r="85" fill="none" stroke="#475569" stroke-width="1.5"/><circle cx="1040" cy="180" r="45" fill="none" stroke="#64748b" stroke-dasharray="6 3" stroke-width="1.5"/><circle cx="1040" cy="180" r="6" fill="#38bdf8"/><line x1="1040" x2="1040" y1="180" y2="60" stroke="#38bdf8" stroke-linecap="round" stroke-width="2" class="radar-line" opacity=".6"/></g><g class="floating-node-2"><g transform="translate(940, 70)"><rect width="170" height="38" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity=".9" rx="19"/><circle cx="20" cy="19" r="6" fill="#10b981"/><text x="36" y="24" fill="#f8fafc" class="badge-text">KR: 100% Target Alignment</text></g><g transform="translate(970, 245)"><rect width="155" height="38" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity=".9" rx="19"/><circle cx="20" cy="19" r="6" fill="#f59e0b"/><text x="36" y="24" fill="#f8fafc" class="badge-text">Progress: 88% Ahead</text></g></g><g><g class="pulse-pill" transform="translate(100, 0) translate(0, 52)"><rect width="250" height="30" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" rx="15"/><circle cx="15" cy="15" r="5" fill="#38bdf8"/><text x="28" y="20" fill="#93c5fd" class="badge-text">🎯 ENTERPRISE STRATEGY &amp; OKRS</text></g><text x="0" y="140" fill="url(#titleGradient)" class="banner-title" transform="translate(100, 0)">Enterprise Strategy &amp; OKR Management</text><text x="0" y="182" class="banner-sub" transform="translate(100, 0)">A curated guide &amp; architecture index to modern strategy execution platforms,</text><text x="0" y="208" class="banner-sub" transform="translate(100, 0)">autonomous OKR cycles, balanced scorecards, and self-hosted open-source software.</text><g><g transform="translate(100, 0) translate(0, 248) translate(0, 0)"><rect width="170" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="14" y="21" fill="#cbd5e1" class="badge-text">🏢 SaaS &amp; Cloud Suites</text></g><g transform="translate(100, 0) translate(0, 248) translate(182, 0)"><rect width="185" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="14" y="21" fill="#cbd5e1" class="badge-text">🔓 100% Open-Source OSS</text></g><g transform="translate(100, 0) translate(0, 248) translate(379, 0)"><rect width="175" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="14" y="21" fill="#cbd5e1" class="badge-text">⚡ AI Agent Automation</text></g><g transform="translate(100, 0) translate(0, 248) translate(566, 0)"><rect width="155" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="14" y="21" fill="#cbd5e1" class="badge-text">📊 Free Tier Analyses</text></g>