<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="0" r="1.5" fill="#334155" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes floatRev {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-2deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.25; stroke-dashoffset: 0; }
        50% { opacity: 0.7; stroke-dashoffset: 40; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes metricPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      .floating-node-1 { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
      .floating-node-2 { animation: floatRev 7s ease-in-out infinite; transform-origin: center; }
      .animated-beam {
        stroke-dasharray: 8 6;
        animation: pulseBeam 4s linear infinite;
      }
      .pulse-pill { animation: metricPulse 3s ease-in-out infinite; transform-origin: center; }
      .radar-line {
        transform-origin: 1040px 180px;
        animation: radarSweep 10s linear infinite;
      }
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.5px;
      }
      .banner-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Background Glowing Orbs (Dynamic Ambience Behind Content) -->
  <circle cx="150" cy="100" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1040" cy="180" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="120" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>

  <!-- Left Side Dynamic Graphic: Cascading Objective Tree (Behind/Flanking) -->
  <g class="floating-node-1" opacity="0.65">
    <path class="animated-beam" d="M 80,180 L 140,110 L 140,250" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="80" cy="180" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="140" cy="110" r="5" fill="#818cf8" />
    <circle cx="140" cy="250" r="5" fill="#34d399" />
  </g>

  <!-- Right Side Dynamic Graphic: OKR Target Radar & Telemetry Rings -->
  <g opacity="0.55">
    <circle cx="1040" cy="180" r="120" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="1040" cy="180" r="85" fill="none" stroke="#475569" stroke-width="1.5" />
    <circle cx="1040" cy="180" r="45" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 3" />
    <circle cx="1040" cy="180" r="6" fill="#38bdf8" />
    <!-- Radar Sweep Line -->
    <line class="radar-line" x1="1040" y1="180" x2="1040" y2="60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Floating Strategy Badges on the right (Dynamic Key Result indicators) -->
  <g class="floating-node-2">
    <!-- Key Result pill 1 -->
    <g transform="translate(940, 70)">
      <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
      <circle cx="20" cy="19" r="6" fill="#10b981" />
      <text x="36" y="24" fill="#f8fafc" class="badge-text">KR: 100% Target Alignment</text>
    </g>
    <!-- Key Result pill 2 -->
    <g transform="translate(970, 245)">
      <rect width="155" height="38" rx="19" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity="0.9"/>
      <circle cx="20" cy="19" r="6" fill="#f59e0b" />
      <text x="36" y="24" fill="#f8fafc" class="badge-text">Progress: 88% Ahead</text>
    </g>
  </g>

  <!-- Foreground Main Content (Clear, crisp, high-contrast, fully visible) -->
  <g transform="translate(100, 0)">
    <!-- Top Meta Tag / Pill -->
    <g transform="translate(0, 52)" class="pulse-pill">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="15" cy="15" r="5" fill="#38bdf8"/>
      <text x="28" y="20" fill="#93c5fd" class="badge-text">🎯 ENTERPRISE STRATEGY &amp; OKRS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" fill="url(#titleGradient)" class="banner-title">
      Enterprise Strategy &amp; OKR Management
    </text>

    <!-- Subtitle Lines -->
    <text x="0" y="182" class="banner-sub">
      A curated guide &amp; architecture index to modern strategy execution platforms,
    </text>
    <text x="0" y="208" class="banner-sub">
      autonomous OKR cycles, balanced scorecards, and self-hosted open-source software.
    </text>

    <!-- Feature Attribute Tags in Foreground -->
    <g transform="translate(0, 248)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21" fill="#cbd5e1" class="badge-text">🏢 SaaS &amp; Cloud Suites</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(182, 0)">
        <rect width="185" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21" fill="#cbd5e1" class="badge-text">🔓 100% Open-Source OSS</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(379, 0)">
        <rect width="175" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21" fill="#cbd5e1" class="badge-text">⚡ AI Agent Automation</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(566, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21" fill="#cbd5e1" class="badge-text">📊 Free Tier Analyses</text>
      </g>
    </g>
  </g>

  <!-- Border Outline -->
  <rect width="1198" height="358" x="1" y="1" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>
</svg>
